name: Optional static judge demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install browser renderer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Python runtime contract
        run: python -m unittest discover -s tests -v
      - name: Check comparison rules
        run: node tests/test_journey.mjs
      - name: Build portable browser demo
        run: python scripts/build_static_demo.py
      - name: Check browser inference and repository subpath
        run: node --test tests/test_static_client.mjs tests/test_cohort_static.mjs tests/test_cohort_filters.mjs tests/test_outcome_description.mjs tests/test_runtime_probe.mjs tests/test_case_transition.mjs tests/test_anatomy_frame.mjs
      - name: Include public submission report and media
        run: |
          mkdir -p dist/site/submission
          cp docs/submission/lumen-report.pdf docs/submission/lumen-demo.mp4 docs/submission/subtitles.srt dist/site/submission/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy judge demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
