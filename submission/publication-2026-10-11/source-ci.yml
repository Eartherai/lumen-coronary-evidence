name: Check reproducible source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned browser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check standard-library runtime and saved source certificates
        run: python -m unittest discover -s tests -v
      - name: Check profile decision rules
        run: node tests/test_journey.mjs
      - name: Build static payload and verify all SHAP source bindings
        run: python scripts/build_static_demo.py
      - name: Check browser inference, cohort filters and repository subpaths
        run: node --test tests/test_static_client.mjs tests/test_cohort_static.mjs tests/test_cohort_filters.mjs tests/test_outcome_description.mjs tests/test_runtime_probe.mjs
